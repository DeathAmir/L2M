name: L2M Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build L2M
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --refresh-dependencies clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: L2M-build
          path: |
            build/libs/L2M-*.jar
            build/packages/L2M-packages-*.zip
          if-no-files-found: error
