name: L2M Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: 1.0.0)"
        required: true
        type: string
      release_notes:
        description: "Release notes / changelog"
        required: true
        type: string
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - release
          - beta
          - alpha
        default: beta
      publish_to:
        description: "Where should the mod be published?"
        required: true
        type: choice
        options:
          - none
          - curseforge
          - modrinth
          - both
        default: curseforge

permissions:
  contents: write

concurrency:
  group: l2m-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish L2M
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Validate release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $RELEASE_VERSION"
            echo "Use a version such as 1.0.0 or 1.0.0-beta.1"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag v$RELEASE_VERSION already exists."
            exit 1
          fi

      - name: Build JAR
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --refresh-dependencies clean build -Pmod_version="$RELEASE_VERSION"

      - name: Locate release JAR
        id: jar
        shell: bash
        run: |
          JAR_FILE="$(find build/libs -maxdepth 1 -type f -name "L2M-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" ! -name "*-dev.jar" | sort | head -n 1)"
          if [[ -z "$JAR_FILE" ]]; then
            echo "No release JAR found in build/libs."
            exit 1
          fi
          echo "path=$JAR_FILE" >> "$GITHUB_OUTPUT"
          echo "file=$(basename "$JAR_FILE")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: L2M v${{ inputs.version }}
          body: ${{ inputs.release_notes }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ steps.jar.outputs.path }}
            build/packages/L2M-packages-*.zip
          draft: false
          prerelease: ${{ inputs.release_type != 'release' }}

      - name: Upload to CurseForge
        if: ${{ inputs.publish_to == 'curseforge' || inputs.publish_to == 'both' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_API_TOKEN }}
          files: ${{ steps.jar.outputs.path }}
          name: "L2M v${{ inputs.version }}"
          version: ${{ inputs.version }}
          version-type: ${{ inputs.release_type }}
          changelog: ${{ inputs.release_notes }}
          loaders: neoforge
          environment: client | server
          game-versions: |
            1.21.1
          game-version-filter: none

      - name: Upload to Modrinth
        if: ${{ inputs.publish_to == 'modrinth' || inputs.publish_to == 'both' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_API_TOKEN }}
          files: ${{ steps.jar.outputs.path }}
          name: "L2M v${{ inputs.version }}"
          version: ${{ inputs.version }}
          version-type: ${{ inputs.release_type }}
          changelog: ${{ inputs.release_notes }}
          loaders: neoforge
          environment: client | server
          game-versions: |
            1.21.1
          game-version-filter: none
