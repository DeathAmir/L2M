name: L2M Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: 1.0.0)"
        required: true
        type: string
      release_notes:
        description: "Release notes / changelog"
        required: true
        type: string
      release_type:
        description: "CurseForge release type"
        required: true
        type: choice
        options:
          - release
          - beta
          - alpha
        default: release
      publish_curseforge:
        description: "Upload the JAR to CurseForge"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: l2m-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish L2M
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Validate release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $RELEASE_VERSION"
            echo "Use a version such as 1.0.0 or 1.0.0-beta.1"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag v$RELEASE_VERSION already exists."
            exit 1
          fi

      - name: Build JAR
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --refresh-dependencies clean build -Pmod_version="$RELEASE_VERSION"

      - name: Locate release JAR
        id: jar
        shell: bash
        run: |
          JAR_FILE="$(find build/libs -maxdepth 1 -type f -name "L2M-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" ! -name "*-dev.jar" | sort | head -n 1)"
          if [[ -z "$JAR_FILE" ]]; then
            echo "No release JAR found in build/libs."
            exit 1
          fi
          echo "path=$JAR_FILE" >> "$GITHUB_OUTPUT"
          echo "file=$(basename "$JAR_FILE")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: L2M v${{ inputs.version }}
          body: ${{ inputs.release_notes }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.jar.outputs.path }}
          draft: false
          prerelease: ${{ inputs.release_type != 'release' }}

      - name: Upload to CurseForge
        if: ${{ inputs.publish_curseforge }}
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CF_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          JAR_PATH: ${{ steps.jar.outputs.path }}
        run: |
          if [[ -z "$CF_API_TOKEN" || -z "$CF_PROJECT_ID" ]]; then
            echo "Missing CURSEFORGE_API_TOKEN or CURSEFORGE_PROJECT_ID secret."
            exit 1
          fi

          GAME_VERSIONS="$(curl -fsSL \
            -H "X-Api-Token: $CF_API_TOKEN" \
            "https://minecraft.curseforge.com/api/game/versions")"

          MC_VERSION_ID="$(printf '%s' "$GAME_VERSIONS" | jq -r '[.[] | select(.name == "1.21.1")][0].id // empty')"
          if [[ -z "$MC_VERSION_ID" ]]; then
            echo "Could not find Minecraft 1.21.1 in CurseForge game versions."
            exit 1
          fi

          METADATA="$(jq -n \
            --arg changelog "$RELEASE_NOTES" \
            --arg displayName "L2M v$RELEASE_VERSION" \
            --arg releaseType "$RELEASE_TYPE" \
            --argjson mcVersion "$MC_VERSION_ID" \
            --argjson neoForgeVersion 10150 \
            '{
              changelog: $changelog,
              changelogType: "markdown",
              displayName: $displayName,
              gameVersions: [$mcVersion, $neoForgeVersion],
              releaseType: $releaseType
            }')"

          RESPONSE="$(curl -fsS -X POST \
            -H "X-Api-Token: $CF_API_TOKEN" \
            -F "metadata=$METADATA" \
            -F "file=@$JAR_PATH;type=application/java-archive" \
            "https://minecraft.curseforge.com/api/projects/$CF_PROJECT_ID/upload-file")"

          echo "CurseForge upload response: $RESPONSE"
